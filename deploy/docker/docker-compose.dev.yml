# Dev infrastructure only — run services locally with `go run ./apps/*/cmd/...`
name: bzy-dev

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: bzy
      POSTGRES_PASSWORD: bzy_dev
      POSTGRES_MULTIPLE_DATABASES: bzy_brain,bzy_runner
    volumes:
      - dev_postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bzy"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"

  nats:
    image: nats:2.10-alpine
    command: -js
    ports:
      - "4222:4222"
      - "8222:8222"

  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

volumes:
  dev_postgres:
